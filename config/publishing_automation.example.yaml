        public:
          - "div:text-is('公开')"
          - "label:has-text('公开')"
        followers:
          - "div:text-is('仅粉丝可见')"
          - "label:has-text('仅粉丝可见')"
        private:
          - "div:text-is('仅自己可见')"
          - "label:has-text('仅自己可见')"
    allow_comment:
      kind: boolean
      selectors:
        - "[role='switch'][aria-label*='评论']"
        - "[role='switch'][aria-label*='允许评论']"
      enabled_selectors:
        - "[role='switch'][aria-label*='评论'][aria-checked='true']"
        - "[role='switch'][aria-label*='允许评论'][aria-checked='true']"
      disabled_selectors:
        - "[role='switch'][aria-label*='评论'][aria-checked='false']"
        - "[role='switch'][aria-label*='允许评论'][aria-checked='false']"
    poi_name:
      kind: fill
      activate:
        - "button:has-text('添加地点')"
        - "span:text-is('添加地点')"
      selectors:
        - "input[placeholder*='搜索地点']"
        - "input[placeholder*='输入地点']"
      confirm_selectors:
        - "div:text-is('{value}')"
        - "span:text-is('{value}')"
  locators:
    title:
      - "input[placeholder*='填写标题']"
      - "input[placeholder*='标题']"
    description:
      - "[contenteditable='true']"
    video_upload:
      - "input.upload-input"
      - "input[type='file']"
    cover_upload:
      - "input[type='file'][accept*='image']"
      - "input[type='file'][accept*='png']"
      - "input[type='file'][accept*='jpg']"
    recommended_cover:
      - ".recommend .defaults > .default:nth-child(2)"
      - ".recommend .defaults > .default:nth-child(3)"
      - ".recommend .defaults > .default:nth-child(1)"
    recommended_cover_applied_text:
      - "已应用推荐封面"
    publish_button:
      - "button:has-text('发布')"
      - "span:text-is('发布')"
